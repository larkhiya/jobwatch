name: web

# Builds the React app and publishes it to GitHub Pages:
# https://<your-username>.github.io/jobwatch/
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:  # re-run by hand after changing the repository variables below

permissions:
  contents: read
  pages: write     # publish to GitHub Pages
  id-token: write  # proves to Pages that this workflow is allowed to deploy

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Repository *variables* (Settings > Secrets and variables > Actions > Variables), not secrets:
          # these values end up in the public web page by design. Empty = the app shows demo data.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_AI_ENABLED: ${{ vars.AI_ENABLED }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
